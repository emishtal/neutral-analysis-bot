services:
  - type: web
    name: neutral-analysis-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-20250514
      - key: DATABASE_PATH
        value: /opt/render/project/src/database.db
    autoDeploy: true
